{{ define "base" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Scheduler</title>

    <link rel="stylesheet" href="/static/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
    <script defer src="/static/htmx/htmx.min.js"></script>
    <script defer src="/static/htmx/htmx.ext-response-targets.js"></script>
    <script defer src="/static/schedule.js"></script>
</head>
<body hx-ext="response-targets">
    <header>
        <h1>Shift Scheduler</h1>
        {{ template "header-status" . }}
    </header>
    {{ template "view-schedule" . }}
    <div id="status-message" class="status-message hidden"></div>
</body>
</html>
{{ end }}
