{{ define "view-schedule" }}
<div id="view-schedule">
    <div class="card">
        <table class="schedule">
            <colgroup>
                <col class="day-col">
                <col>
                <col>
                <col>
                <col>
                <col>
                <col>
                <col>
                <col>
                <col>
                <col>
                <col class="total-col">
            </colgroup>
            <tr class="header-row">
                <th></th>
                <th class="hour-label">8am</th>
                <th class="hour-label">9am</th>
                <th class="hour-label">10am</th>
                <th class="hour-label">11am</th>
                <th class="hour-label">12pm</th>
                <th class="hour-label">1pm</th>
                <th class="hour-label">2pm</th>
                <th class="hour-label">3pm</th>
                <th class="hour-label">4pm</th>
                <th class="hour-label">5pm</th>
                <td id="total-week" class="total week-total">{{ printf "%.2f" .Week.TotalTime }} hrs</td>
            </tr>
            {{ template "week-view" . }}
        </table>
    </div>
    {{ if .IsAdmin }}
        <form class="admin-schedule-actions">
            <button
                type="button"
                class="cancel"
                hx-get="/admin"
                hx-target="#view-schedule"
                hx-swap="outerHTML"
            >Cancel</button>
            <div>
                <input name="approval-comments" class="approval-comments" type="text">
                <button
                    type="submit"
                    class="approve"
                    hx-put="/admin/approve"
                    hx-target="#view-schedule"
                    hx-swap="outerHTML"
                    >Approve</button>
                    <button
                    type="submit"
                    class="reject"
                    hx-put="/admin/reject"
                    hx-target="#view-schedule"
                    hx-swap="outerHTML"
                >Reject</button>
            </div>
        </form>
    {{ else }}
        <button
            hx-get="/schedule/edit"
            hx-target="#view-schedule"
            hx-swap="outerHTML"
        >Edit</button>
    {{ end }}
</div>
{{ end }}
